name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint（警告也視為失敗）
        run: pnpm lint:check

      - name: 格式檢查
        run: pnpm format:check

      - name: 型別檢查
        run: pnpm typecheck

      - name: 單元測試
        run: pnpm test:run

      - name: 建置
        run: pnpm build

      - name: 瀏覽器測試（Chromium）
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: 相依套件稽核（high 以上）
        run: pnpm audit --audit-level high
