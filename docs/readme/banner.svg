<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="Lucky50 農民曆智慧投資">
  <!-- README 封面：沿用網站設計 tokens（宣紙底、朱紅印章、金字） -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b1a18" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="#f3f2ee" />
  <rect width="1280" height="360" rx="24" fill="url(#grid)" />

  <!-- 品牌印記 -->
  <g transform="translate(96 84)">
    <rect width="192" height="192" rx="36" fill="#c0282d" />
    <rect x="14" y="14" width="164" height="164" rx="26" fill="none" stroke="#f0c43c" stroke-opacity="0.7" stroke-width="4" />
    <text x="96" y="130" text-anchor="middle" font-family="'LXGW WenKai TC','Kaiti TC','BiauKai','Noto Serif TC','Songti TC',serif" font-size="108" font-weight="700" fill="#f0c43c">福</text>
  </g>

  <!-- 直排小標 -->
  <line x1="352" y1="96" x2="352" y2="264" stroke="#c0282d" stroke-opacity="0.5" stroke-width="2" />
  <text x="374" y="104" writing-mode="tb" font-family="'Noto Serif TC','Songti TC',serif" font-size="20" letter-spacing="6" fill="#c0282d">翻開今天的農民曆</text>

  <!-- 標題 -->
  <text x="424" y="168" font-family="'Noto Serif TC','Songti TC','PMingLiU',serif" font-size="72" font-weight="900" fill="#1b1a18">今天，<tspan fill="#c0282d">宜</tspan>買 0050 嗎？</text>
  <text x="428" y="226" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#5a5750">農民曆宜忌 × 八字紫微 × 0050 行情，每天抽一支專屬投資籤</text>

  <!-- 底部標籤 -->
  <g font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="18">
    <rect x="428" y="256" width="96" height="36" rx="18" fill="#c0282d" />
    <text x="476" y="280" text-anchor="middle" fill="#fff8e6">今日籤</text>
    <rect x="536" y="256" width="116" height="36" rx="18" fill="none" stroke="#1b1a18" stroke-opacity="0.18" />
    <text x="594" y="280" text-anchor="middle" fill="#3a3833">十二時辰</text>
    <rect x="664" y="256" width="116" height="36" rx="18" fill="none" stroke="#1b1a18" stroke-opacity="0.18" />
    <text x="722" y="280" text-anchor="middle" fill="#3a3833">五行生剋</text>
    <rect x="792" y="256" width="116" height="36" rx="18" fill="none" stroke="#1b1a18" stroke-opacity="0.18" />
    <text x="850" y="280" text-anchor="middle" fill="#3a3833">走勢吉印</text>
  </g>

  <!-- 右上角干支印 -->
  <g transform="translate(1104 64) rotate(-6)">
    <rect width="80" height="80" rx="8" fill="#fbfaf7" stroke="#c0282d" stroke-width="4" />
    <rect x="8" y="8" width="64" height="64" rx="4" fill="none" stroke="#c0282d" stroke-width="2" />
    <text x="40" y="36" text-anchor="middle" font-family="'LXGW WenKai TC','Kaiti TC',serif" font-size="26" font-weight="700" fill="#c0282d">吉</text>
    <text x="40" y="64" text-anchor="middle" font-family="'LXGW WenKai TC','Kaiti TC',serif" font-size="26" font-weight="700" fill="#c0282d">日</text>
  </g>
</svg>
